name: Show the bug

on:
  push:
  workflow_dispatch:

jobs:
  leak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Appium + Fake driver
        run: |
          npm install -g appium
          appium driver install fake

      - name: Open a real Appium session
        env:
          APP_PASSWORD: 'MyP@ss1!'
        run: mvn -q compile exec:java

name: Show the bug

on:
  push:
  workflow_dispatch:

jobs:
  leak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install -g appium && appium driver install --source=npm @appium/fake-driver
      - name: Open Appium session
        env:
          APP_PASSWORD: 'MyP@ss1!'
        run: mvn -q compile exec:java
